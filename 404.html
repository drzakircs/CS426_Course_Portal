<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · CS-426</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f8fb;
      color: #172234;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: 38px;
      border: 1px solid #dbe3ec;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(11, 31, 58, .08);
    }
    .code { color: #2f7d5a; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 8px 0 10px; color: #0b1f3a; font-size: clamp(2rem, 7vw, 3rem); }
    p { color: #5a677a; }
    a {
      display: inline-flex;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 9px;
      background: #12345a;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">CS-426</div>
    <h1>Page not found</h1>
    <p>The requested course material or page could not be found. It may have been renamed, replaced, or removed.</p>
    <a id="home-link" href="./">Return to course portal</a>
  </main>
  <script>
    (function () {
      const parts = location.pathname.split('/').filter(Boolean);
      const isGitHubPages = location.hostname.endsWith('.github.io');
      const root = isGitHubPages && parts.length ? `/${parts[0]}/` : '/';
      document.getElementById('home-link').href = root;
    }());
  </script>
</body>
</html>
